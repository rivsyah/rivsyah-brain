# Bara — konfigurasi aldo-starter untuk mesin "riv" (Windows 11).
# Disalin dari agent.conf.example. Secrets TIDAK ada di sini — lihat env.db.

# ---------- who the agent is ----------
AGENT_NAME="Bara"                       # agent all-in-one yang sudah dipakai Aldo
MACHINE_ID="riv"                        # hostname mesin ini
MACHINE_OS="windows"

# ---------- who the owner is ----------
OWNER_NAME="Rivaldo Harviansyah"
OWNER_SHORT="Aldo"
OWNER_EMAIL="rivsyah@gmail.com"         # identitas git asli, bukan alamat akun sesi
OWNER_ROLE="CEO of AIgnited"
OWNER_LANG="Bahasa Indonesia"

# ---------- where things live ----------
# $HOME/claude TIDAK dipakai: di Windows itu bentrok dengan C:\Users\rivsy\Claude yang sudah ada.
BRAIN="$HOME/brain"
PROJECTS="$HOME/dev"                    # kerja nyata tetap di ~/Herd; lihat rules/machines/riv.md
SPAWN="$HOME"

# ---------- the private repo that holds your brain ----------
GITHUB_USER="rivsyah"
BRAIN_REPO="rivsyah/rivsyah-brain"

# ---------- how much rope the agent gets ----------
AUTONOMY="normal"

# ---------- scopes ----------
SCOPES="kemlu,research,aignited,personal"

# ---------- confidential paths ----------
CONFIDENTIAL_DIRS=""
